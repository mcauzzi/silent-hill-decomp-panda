name: Build Android Port (arm64 + arm32)

# Produces the sideloadable debug APK by running android_port/build_android.sh,
# the same script a maintainer runs. CI calling the project's own script rather
# than gradle directly is deliberate: a change that breaks the script breaks the
# build everyone actually uses.
#
# Signed only by the debug keystore Gradle generates, which is all a sideload
# needs. Release signing stays with the maintainer, who has the keystore.
#
# The 32-bit library is what earns this its keep. Every maintainer device is
# arm64, so armeabi-v7a is built and never run; a compile break there, or an ABI
# silently dropped from the APK, is otherwise invisible until a user on an older
# tablet reports it.

on:
  push:
    branches: [android-port]
    paths-ignore:
      - '**.md'
      - 'pc_port/launcher/**'
  pull_request:
    branches: [android-port]
  workflow_dispatch:
    inputs:
      crash_offsets:
        description: 'libmain.so offsets from a [CRASH] backtrace (arm64), e.g. "0x578084 0x4ef3f8"'
        required: false
        default: ''

# One build per branch: pushes land in bursts and a superseded run is wasted
# runner time.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Upstream, plus this fork, which ships its own Android builds.
    if: github.repository == 'SlickAmogus/silent-hill-decomp' || github.repository == 'mcauzzi/silent-hill-decomp-panda'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with SDL + PsyCross submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # AGP 8.5 refuses to run on a newer JDK, the same reason
      # build_android.sh pins a JDK 17 locally.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Exactly the versions app/build.gradle pins. The runner image ships an
      # SDK and some NDK, but not necessarily these, and a mismatch fails late
      # with a message that does not name the cause.
      - name: Android SDK components
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK at $SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      # Not tracked in git (it names a local path), so CI writes its own.
      - name: Point the build at this runner's SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android_port/local.properties

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # The build runs this Gradle, never a wrapper. The only wrapper JARs
          # in the tree are inside the SDL submodules, whose checksum the
          # action does not know, and they fail the job before anything builds.
          validate-wrappers: false

      - name: Toolchain versions
        run: |
          java -version
          gradle --version | head -8
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk"

      # A fixed signing key, so each APK installs over the last one. Without
      # the secret the runner makes a fresh debug key every run, and Android
      # refuses to update an app signed with a different key.
      - name: Fixed debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "SH_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using the fixed debug key from secrets"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 not set: the APK gets a throwaway key and will not install over a previous build"
          fi

      - name: Build
        # The script takes its JDK and gradle from these, which is how it runs
        # unchanged off a Windows machine.
        env:
          JAVA_HOME_ANDROID: ${{ env.JAVA_HOME }}
          GRADLE_BIN: gradle
        run: |
          chmod +x android_port/build_android.sh
          ./android_port/build_android.sh

      - name: Report what was built
        run: |
          set -eu
          APK=android_port/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          echo "=== native libraries in the APK ==="
          unzip -l "$APK" | grep "lib/"
          # Both ABIs, or the build is not what it claims: Gradle will happily
          # produce a single-ABI APK when one CMake configure fails, and that
          # APK still installs -- on the half of devices that match.
          for abi in arm64-v8a armeabi-v7a; do
            for so in libmain.so libSDL2.so; do
              unzip -l "$APK" | grep -q "lib/$abi/$so" || { echo "MISSING lib/$abi/$so"; exit 1; }
            done
          done
          echo "both ABIs present"
          # Same fingerprint every build = the fixed key; it changing means the
          # APK will not install over the previous one.
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          echo "=== unstripped library sizes per ABI ==="
          find android_port/app/build/intermediates/cxx -name libmain.so -exec ls -la {} +

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SilentHill-android-debug
          path: android_port/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # The APK's libmain.so is stripped, so a [CRASH] backtrace from a player's
      # log names only exported symbols. These keep the debug info:
      #   llvm-addr2line -f -C -i -e libmain.so 0x<offset>
      - name: Upload unstripped native libraries
        uses: actions/upload-artifact@v4
        with:
          name: SilentHill-android-symbols
          path: android_port/app/build/intermediates/cxx/**/obj/*/libmain.so
          if-no-files-found: error
          retention-days: 90

      - name: Resolve crash offsets
        if: ${{ inputs.crash_offsets != '' }}
        env:
          OFFSETS: ${{ inputs.crash_offsets }}
        run: |
          set -eu
          SO=$(find android_port/app/build/intermediates/cxx -path '*/obj/arm64-v8a/libmain.so' | head -1)
          # A symlink to llvm-symbolizer in the NDK, so no -type f.
          A2L=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.3.13750724" -name llvm-addr2line | head -1)
          echo "addr2line: $A2L  lib: $SO"
          for off in $OFFSETS; do
            echo "== $off"
            "$A2L" -f -C -i -a -e "$SO" "$off"
          done
          # Disassembly around the first (faulting) offset, with source lines.
          OBJDUMP="$(dirname "$A2L")/llvm-objdump"
          first=$(echo $OFFSETS | cut -d' ' -f1)
          "$OBJDUMP" -d -l --no-show-raw-insn \
            --start-address=$(( first - 0x100 )) --stop-address=$(( first + 0x40 )) "$SO"
